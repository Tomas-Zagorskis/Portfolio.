name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 requires >= 20.9; 22 is the current LTS.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Only read at request time, but the module constructs its client at
          # import, so give the build a placeholder rather than a real secret.
          RESEND_API_KEY: build-placeholder
